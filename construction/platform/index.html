<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PFI Development Intelligence | Command Center</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f7;font:13px Arial,sans-serif;color:#1b4261}header{background:#103e61;color:white;padding:14px 22px;display:flex;justify-content:space-between;gap:12px}header b{font-size:17px;letter-spacing:.5px}header small{display:block;color:#c2d7e6;margin-top:4px}nav{background:white;display:flex;align-items:center;gap:7px;padding:10px 18px;border-bottom:1px solid #c9dce8;flex-wrap:wrap}button{border:1px solid #c5dbe8;border-radius:6px;background:#e6f0f6;padding:9px 13px;color:#1d4d6c;font-weight:bold;cursor:pointer}button.on{color:white;background:#145d84}a{margin-left:auto;color:#155e87}iframe{border:0;width:100%;height:calc(100vh - 119px);background:#f0f6fa;display:block}@media(max-width:780px){iframe{height:calc(100vh - 170px)}a{margin-left:0}}button#resetAll{background:#fff1ed;color:#9f3c32;border-color:#edc8c4}#pane[hidden],#workspacePane[hidden]{display:none!important}</style></head><body><header><div><b>PFI DEVELOPMENT INTELLIGENCE</b><small>Construction Job Controls · Land Feasibility · Development Forecast · CRE Underwriting</small></div><small>Unified Preview v1.0 · Original Platform + Document Intelligence</small></header><nav><button id="construction" class="on" onclick="pick('construction')">Construction Job Controls</button><button id="land" onclick="pick('land')">Land / Highest & Best Use</button><button id="development" onclick="pick('development')">Condo Development / Due Diligence</button><button id="cre" onclick="pick('cre')">10-Year CRE / LP-GP</button><button id="documents" onclick="pick('documents')">Document Intake & CFO Dashboards</button><button id="resetAll" onclick="resetUnified()">Reset Workspace</button><a target="_blank" rel="noopener" href="./construction.html" id="full">Open Full Screen</a></nav><iframe id="pane" src="about:blank" title="PFI Financial Command Center"></iframe><iframe id="workspacePane" src="about:blank" title="PFI Document Intake" style="display:none"></iframe><script>
const urls={construction:'./construction.html',land:'./site.html',development:'./development.html',cre:'./cre.html',documents:'../workspace/'};
const modelKeys=['pfi-dev-v04','pfi-construction-v07','pfi-hbu-v06','pfi-cre-v05'];
const pane=document.getElementById('pane'),intake=document.getElementById('workspacePane'),status=document.getElementById('unifiedStatus');
let lastSnapshot=null,intakeLoaded=false,current='construction';
function blankMode(){try{return localStorage.getItem('pfi-unified-cleared-v1')!=='0'}catch(e){return true}}
function complete(){let v=lastSnapshot?.values;return !!v&&['land','residential','retailcost','parkingcost','indirect','condosales','retailsales','salesexpenses'].every(k=>Number.isFinite(v[k]))}
function allowed(x){if(x==='documents')return true;if(x==='development'&&complete())return true;return !blankMode()}
function dest(x){return allowed(x)?urls[x]:'./blank.html?module='+encodeURIComponent(x)}
function updateStatus(){status.textContent=lastSnapshot?.documents?lastSnapshot.documents+' uploaded files · '+(lastSnapshot.logicalDocuments||lastSnapshot.documents)+' source documents · '+(complete()?'Development inputs active':'Review pending'):'EMPTY WORKSPACE · No uploaded data'}
function pick(x){
 if(!(x in urls))x='construction';current=x;
 document.querySelectorAll('nav button').forEach(b=>{if(b.id!=='resetAll')b.classList.toggle('on',b.id===x)});
 if(x==='documents'){pane.hidden=true;intake.hidden=false;intake.style.display='block';if(!intakeLoaded){intake.src=urls.documents;intakeLoaded=true}document.getElementById('full').href=urls.documents}
 else{intake.hidden=true;intake.style.display='none';pane.hidden=false;let u=dest(x);if(pane.getAttribute('src')!==u)pane.src=u;document.getElementById('full').href=u}
 if(location.hash.slice(1)!==x)location.hash=x;
}
function clearStorage(){for(let k of modelKeys)try{localStorage.removeItem(k)}catch(e){}try{sessionStorage.removeItem('pfi-unified-model-v1')}catch(e){}try{localStorage.setItem('pfi-unified-cleared-v1','1')}catch(e){}}
function resetUnified(confirmed=false,sourceIsIntake=false){
 if(!confirmed&&!confirm('Clear all uploaded files, financial values and saved sample data in all five V1 tabs? This cannot be undone.'))return;
 clearStorage();lastSnapshot=null;updateStatus();
 if(intakeLoaded&&!sourceIsIntake)intake.contentWindow?.postMessage({type:'PFI_CLEAR_UPLOADS'},location.origin);
 if(current!=='documents')pick(current);
 if(current==='documents'&&!intakeLoaded)pick('documents');
}
function sendToDev(){if(complete()&&pane.getAttribute('src')?.includes('development.html'))pane.contentWindow?.postMessage({type:'PFI_APPLY_DOCUMENT_MODEL',snapshot:lastSnapshot},location.origin)}
pane.addEventListener('load',sendToDev);
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||!e.data)return;
 if(e.source===intake.contentWindow){
  if(e.data.type==='PFI_RESET_ALL'){resetUnified(true,true);return}
  if(e.data.type==='PFI_WORKSPACE_SNAPSHOT'){
   lastSnapshot=e.data.snapshot?.documents?e.data.snapshot:null;
   updateStatus();
   if(current!=='documents')pick(current);
   if(lastSnapshot?.documents&&complete())sendToDev();
  }
 }else if(e.source===pane.contentWindow&&e.data.type==='PFI_DEV_MODEL_READY')sendToDev();
});
window.addEventListener('hashchange',()=>{let x=location.hash.slice(1);if(x in urls&&x!==current)pick(x)});
try{sessionStorage.removeItem('pfi-unified-model-v1')}catch(e){}
if(blankMode())clearStorage();
updateStatus();pick(location.hash.slice(1) in urls?location.hash.slice(1):'construction');
</script>
</body></html>
